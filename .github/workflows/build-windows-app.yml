name: Build Inventory Licence Control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows_app/**"
      - ".github/workflows/build-windows-app.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure licence service URL
        shell: pwsh
        env:
          CONFIGURED_URL: ${{ vars.LICENCE_API_URL }}
        run: |
          $url = if ($env:CONFIGURED_URL) { $env:CONFIGURED_URL.TrimEnd('/') } else { 'https://saiko-licence.vercel.app' }
          "LICENCE_API_URL = `"$url`"" | Set-Content windows_app/backend_config.py
      - name: Install build tools
        run: python -m pip install -r windows_app/requirements-build.txt
      - name: Create Windows icon
        run: python windows_app/make_icon.py
      - name: Build EXE
        working-directory: windows_app
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name InventoryLicenceControl
          --icon assets/app-icon.ico
          --add-data "assets/app-icon.ico;assets"
          app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: InventoryLicenceControl-Windows
          path: windows_app/dist/InventoryLicenceControl.exe
          if-no-files-found: error
