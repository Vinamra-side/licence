<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241820"><title>Saiko Licence Owner</title><link rel="manifest" href="{{ url_for('manifest') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='app-icon-192.png') }}"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script defer src="{{ url_for('static', filename='pwa.js') }}"></script></head>
<body class="owner-page"><main class="owner-card compact"><img src="{{ url_for('static', filename='saiko-logo-clean.png') }}" alt="SAIKO" class="owner-logo"><div class="eyebrow">SEPARATE OWNER PORTAL</div><h1>Licence administration</h1><p class="subtitle">Use the fixed owner login. Staff application accounts do not work here.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="stacked"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Owner login ID</label><input id="username" name="username" maxlength="80" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Open licence control <span>→</span></button></form></main></body></html>
